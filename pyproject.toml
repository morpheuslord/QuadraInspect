[project]
name = "quadrainspect"
version = "2.0.0"
description = "A modular Android APK analysis framework integrating AndroPass, APKLeaks, MobFS and RMS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "morpheuslord" }]
keywords = ["android", "apk", "security", "analysis", "pentest", "mobile"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]

# Core runtime dependencies of the framework itself.
dependencies = [
    "rich>=13.3.3",
    "pyfiglet>=0.7",
    "GitPython>=3.1.31",
]

[project.optional-dependencies]
# Extra libraries used by the bundled analysis scripts that run under the same
# Python interpreter (APKLeaks, AndroPass, MobFS helpers, ...).
tools = [
    "pyaxmlparser>=0.3.28",
    "defusedxml>=0.7.1",
    "lxml>=4.6.2",
    "requests>=2.25.1",
    "bs4>=0.0.1",
    "rsa>=4.7",
    "macholib>=1.14",
    "colorlog>=4.7.2",
]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/morpheuslord/QuadraInspect"
Repository = "https://github.com/morpheuslord/QuadraInspect"

[project.scripts]
quadrainspect = "quadrainspect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quadrainspect"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
